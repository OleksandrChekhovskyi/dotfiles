[font]
size = 13
offset.x = 1
offset.y = 1

[font.normal]
family = "SauceCodePro Nerd Font"
style = "Regular"

[font.bold]
family = "SauceCodePro Nerd Font"
style = "Bold"

[font.italic]
family = "SauceCodePro Nerd Font"
style = "Italic"

[window]
decorations = "none"
# Make Option behave as a real Alt/Meta for shell and editor shortcuts.
option_as_alt = "Both"

# Cmd sits where Linux has Alt, so it sends the same Meta sequences tmux binds.
# Cmd+H also needs the "Hide alacritty" menu shortcut moved (see README).
[keyboard]
bindings = [
	{ key = "H", mods = "Command", chars = "\u001Bh" },
	{ key = "J", mods = "Command", chars = "\u001Bj" },
	{ key = "K", mods = "Command", chars = "\u001Bk" },
	{ key = "L", mods = "Command", chars = "\u001Bl" },
	{ key = "H", mods = "Command|Shift", chars = "\u001BH" },
	{ key = "J", mods = "Command|Shift", chars = "\u001BJ" },
	{ key = "K", mods = "Command|Shift", chars = "\u001BK" },
	{ key = "L", mods = "Command|Shift", chars = "\u001BL" },
	{ key = "Left",  mods = "Command",       chars = "\u001B[1;3D" },
	{ key = "Right", mods = "Command",       chars = "\u001B[1;3C" },
	{ key = "Left",  mods = "Command|Shift", chars = "\u001B[1;4D" },
	{ key = "Right", mods = "Command|Shift", chars = "\u001B[1;4C" },
	# Option+Arrow word-jumps as M-b / M-f, leaving M-Left / M-Right to tmux.
	{ key = "Left",  mods = "Option", chars = "\u001Bb" },
	{ key = "Right", mods = "Option", chars = "\u001Bf" },
]
