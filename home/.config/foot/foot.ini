font=Source Code Pro:size=10:style=Regular
font-bold=Source Code Pro:size=10:style=Bold
font-italic=Source Code Pro:size=10:style=Italic

[scrollback]
# Match Alacritty's default history size.
lines=10000

[cursor]
style=beam
blink=yes

# Keep in sync with ../alacritty/colors.toml.
[colors-dark]
background=000000
foreground=ffffff
cursor=000000 ffffff
selection-background=b5d5ff
selection-foreground=000000
regular0=000000
regular1=cc0000
regular2=4e9a06
regular3=c4a000
regular4=3465a4
regular5=75507b
regular6=06989a
regular7=d3d7cf
bright0=555753
bright1=ef2929
bright2=8ae234
bright3=fce94f
bright4=729fcf
bright5=ad7fa8
bright6=34e2e2
bright7=eeeeec

[text-bindings]
\x0a=Shift+Return
\x0c=Control+Shift+k
# Ctrl+' supplies the missing ` / ~ key on compact keyboards.
`=Control+apostrophe
~=Control+Shift+apostrophe
