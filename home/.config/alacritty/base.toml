[font]
size = 10

[font.normal]
family = "Source Code Pro"
style = "Regular"

[font.bold]
family = "Source Code Pro"
style = "Bold"

[font.italic]
family = "Source Code Pro"
style = "Italic"

[cursor]
style = { shape = "Beam", blinking = "On" }

[keyboard]
bindings = [
	{ key = "Return", mods = "Shift", chars = "\n" },
	{ key = "K", mods = "Control|Shift", chars = "\f" },
	{ key = "N", mods = "Control|Shift", action = "CreateNewWindow" },
	# Alt+' stands in for the ` / ~ key missing on function-rowless keyboards.
	# The shifted half needs two bindings: it arrives as `"` on Linux/BSD, `'` on macOS.
	{ key = "'",  mods = "Alt",       chars = "`" },
	{ key = "\"", mods = "Alt|Shift", chars = "~" },
	{ key = "'",  mods = "Alt|Shift", chars = "~" },
	# macOS-only: forward Cmd+Arrow to tmux as user-keys for window switching.
	# (Alt+Arrow is reserved for shell word-jump.) Inert on Linux.
	{ key = "Left",  mods = "Command",       chars = "\u001B[5900~" },
	{ key = "Right", mods = "Command",       chars = "\u001B[5901~" },
	{ key = "Left",  mods = "Command|Shift", chars = "\u001B[5902~" },
	{ key = "Right", mods = "Command|Shift", chars = "\u001B[5903~" },
]
