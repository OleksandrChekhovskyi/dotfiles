[font]
size = 10

[font.normal]
family = "Source Code Pro"
style = "Regular"

[font.bold]
family = "Source Code Pro"
style = "Bold"

[font.italic]
family = "Source Code Pro"
style = "Italic"

[cursor]
style = { shape = "Beam", blinking = "On" }

[keyboard]
bindings = [
	{ key = "Return", mods = "Shift", chars = "\n" },
	{ key = "K", mods = "Control|Shift", chars = "\f" },
	{ key = "N", mods = "Control|Shift", action = "CreateNewWindow" },
	# Linux/BSD defaults, repeated so macOS copies and pastes with them too (besides Cmd+C/V).
	{ key = "C", mods = "Control|Shift", action = "Copy" },
	{ key = "V", mods = "Control|Shift", action = "Paste" },
	# Ctrl+' stands in for the ` / ~ key missing on function-rowless keyboards.
	# The shifted half needs two bindings: it arrives as `"` on Linux/BSD, `'` on macOS.
	{ key = "'",  mods = "Control",       chars = "`" },
	{ key = "\"", mods = "Control|Shift", chars = "~" },
	{ key = "'",  mods = "Control|Shift", chars = "~" },
]
