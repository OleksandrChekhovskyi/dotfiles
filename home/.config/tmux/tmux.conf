# Minimal, modern tmux defaults.

# Keep indexing consistent with editor/tab UX.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Improve terminal/editor behavior.
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty:RGB,tmux-256color:RGB,xterm-256color:RGB"
set -g set-clipboard on
set -g cursor-style blinking-bar

# Better day-to-day usability.
set -g mouse on
set -g history-limit 100000
setw -g mode-keys vi
set -g xterm-keys on

# Enter scrollback on wheel-up without `-e`. The default root binding uses
# `copy-mode -e`, which flags the pane to auto-exit copy mode the moment you
# scroll back to the live bottom. That flag is checked inside `scroll-down`, so
# it fires even mid-drag and discards an in-progress selection. We drop it here
# and instead reproduce the auto-exit ourselves in WheelDownPane below, but only
# when no selection is active.
bind -n WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" \
    'send-keys -M' 'copy-mode'

# Wheel-down in copy mode: scroll, then auto-exit at the live bottom as usual —
# unless a selection is in progress, in which case stay so the selection (and
# the ability to extend it at the bottom) is preserved.
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down \; \
    if-shell -F "#{&&:#{==:#{scroll_position},0},#{==:#{selection_present},0}}" \
    'send-keys -X cancel'

# Mouse selection: exit copy mode at live bottom, stay put in scrollback.
bind -T copy-mode-vi MouseDragEnd1Pane if-shell -F '#{==:#{scroll_position},0}' \
    'send-keys -X copy-selection-and-cancel' \
    'send-keys -X copy-selection'
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; \
    if-shell -F '#{==:#{scroll_position},0}' \
    'send-keys -X copy-selection-and-cancel' \
    'send-keys -X copy-selection'

# Window/pane navigation.
# Pane bindings use Alt+hjkl on both platforms. On macOS this requires
# `option_as_alt = "Both"` in Alacritty (set in base.toml) so Option behaves
# as a real Meta key.
# Window (tab) bindings differ by platform: Alt+Arrow on Linux, Cmd+Arrow on
# macOS — the latter because Alt+Arrow is reserved for shell word-jump there.
# Alacritty translates Cmd+Arrow into private escape sequences which we
# receive as user-keys.
# Detection: $DOTFILES_HOST_OS overrides `uname` so a Linux container running
# tmux on a macOS host can opt into the Cmd bindings (set DOTFILES_HOST_OS=Darwin
# on the macOS host and forward it via SSH SendEnv / `docker run -e`).

# Pane switching with Alt+hjkl (both platforms).
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
# Swap panes with Alt+Shift+hjkl (both platforms).
bind -n M-H swap-pane -d -t "{left-of}"
bind -n M-J swap-pane -d -t "{down-of}"
bind -n M-K swap-pane -d -t "{up-of}"
bind -n M-L swap-pane -d -t "{right-of}"

if-shell '[ "${DOTFILES_HOST_OS:-$(uname)}" != Darwin ]' {
    # Window (tab) switching with Alt+Arrow.
    bind -n M-Left previous-window
    bind -n M-Right next-window
    # Reorder windows with Alt+Shift+Arrow.
    bind -n M-S-Left swap-window -d -t -1
    bind -n M-S-Right swap-window -d -t +1
}
if-shell '[ "${DOTFILES_HOST_OS:-$(uname)}" = Darwin ]' {
    # Window (tab) switching with Cmd+Arrow.
    set -s user-keys[0]  "\e[5900~"
    set -s user-keys[1]  "\e[5901~"
    bind -n User0  previous-window
    bind -n User1  next-window
    # Reorder windows with Cmd+Shift+Arrow.
    set -s user-keys[2]  "\e[5902~"
    set -s user-keys[3]  "\e[5903~"
    bind -n User2  swap-window -d -t -1
    bind -n User3  swap-window -d -t +1
}

# Open splits and new windows in the current pane's working directory.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind c
bind c new-window -c "#{pane_current_path}"

# Quick config reload.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Subtle, low-contrast status line.
set -g status-style "bg=default,fg=colour245"
setw -g window-status-style "bg=default,fg=colour244"
setw -g window-status-current-style "bg=default,fg=colour252,bold"
set -g status-right-length 120
set -g status-right "#{pane_title}"
# Subtle pane borders.
set -g pane-border-style "fg=colour235,bg=default"
set -g pane-active-border-style "fg=colour237,bg=default"
set -g pane-border-indicators "off"
