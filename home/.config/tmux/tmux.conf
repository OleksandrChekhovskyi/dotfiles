# Minimal, modern tmux defaults.

# Keep indexing consistent with editor/tab UX.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Improve terminal/editor behavior.
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty:RGB,tmux-256color:RGB,xterm-256color:RGB"
set -g set-clipboard on
set -g cursor-style blinking-bar

# Better day-to-day usability.
set -g mouse on
set -g history-limit 100000
setw -g mode-keys vi
set -g xterm-keys on

# Window/pane navigation.
# On Linux: Alt+Arrow / Alt+hjkl. On macOS, Alt+Arrow conflicts with shell
# word-jump, so Alacritty translates Cmd+Arrow / Cmd+hjkl into private escape
# sequences which we receive here as user-keys.
# Detection: $DOTFILES_HOST_OS overrides `uname` so a Linux container running
# tmux on a macOS host can opt into the Cmd bindings (set DOTFILES_HOST_OS=Darwin
# on the macOS host and forward it via SSH SendEnv / `docker run -e`).
if-shell '[ "${DOTFILES_HOST_OS:-$(uname)}" != Darwin ]' {
    # Window (tab) switching with Alt+Arrow.
    bind -n M-Left previous-window
    bind -n M-Right next-window
    # Reorder windows with Alt+Shift+Arrow.
    bind -n M-S-Left swap-window -d -t -1
    bind -n M-S-Right swap-window -d -t +1
    # Pane switching with Alt+hjkl.
    bind -n M-h select-pane -L
    bind -n M-j select-pane -D
    bind -n M-k select-pane -U
    bind -n M-l select-pane -R
    # Swap panes with Alt+Shift+hjkl.
    bind -n M-H swap-pane -d -t "{left-of}"
    bind -n M-J swap-pane -d -t "{down-of}"
    bind -n M-K swap-pane -d -t "{up-of}"
    bind -n M-L swap-pane -d -t "{right-of}"
}
if-shell '[ "${DOTFILES_HOST_OS:-$(uname)}" = Darwin ]' {
    # Window (tab) switching with Cmd+Arrow.
    set -s user-keys[0]  "\e[5900~"
    set -s user-keys[1]  "\e[5901~"
    bind -n User0  previous-window
    bind -n User1  next-window
    # Reorder windows with Cmd+Shift+Arrow.
    set -s user-keys[2]  "\e[5902~"
    set -s user-keys[3]  "\e[5903~"
    bind -n User2  swap-window -d -t -1
    bind -n User3  swap-window -d -t +1
    # Pane switching with Cmd+hjkl.
    set -s user-keys[4]  "\e[5904~"
    set -s user-keys[5]  "\e[5905~"
    set -s user-keys[6]  "\e[5906~"
    set -s user-keys[7]  "\e[5907~"
    bind -n User4  select-pane -L
    bind -n User5  select-pane -D
    bind -n User6  select-pane -U
    bind -n User7  select-pane -R
    # Swap panes with Cmd+Shift+hjkl.
    set -s user-keys[8]  "\e[5908~"
    set -s user-keys[9]  "\e[5909~"
    set -s user-keys[10] "\e[5910~"
    set -s user-keys[11] "\e[5911~"
    bind -n User8  swap-pane -d -t "{left-of}"
    bind -n User9  swap-pane -d -t "{down-of}"
    bind -n User10 swap-pane -d -t "{up-of}"
    bind -n User11 swap-pane -d -t "{right-of}"
}

# Open splits and new windows in the current pane's working directory.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind c
bind c new-window -c "#{pane_current_path}"

# Quick config reload.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Subtle, low-contrast status line.
set -g status-style "bg=default,fg=colour245"
setw -g window-status-style "bg=default,fg=colour244"
setw -g window-status-current-style "bg=default,fg=colour252,bold"
set -g status-right-length 120
set -g status-right "#{pane_title}"
# Subtle pane borders.
set -g pane-border-style "fg=colour235,bg=default"
set -g pane-active-border-style "fg=colour237,bg=default"
set -g pane-border-indicators "off"
